<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tesla Mail — Internal</title>
<style>
  :root {
    --tesla-red: #e31937;
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1c1c1c;
    --line: #2a2a2a;
    --text: #f4f4f4;
    --muted: #8a8a8a;
    --muted-2: #6a6a6a;
    --accent: #3457d5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Helvetica Neue", "Inter", Arial, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Top bar ---------- */
  header.topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
    height: 60px;
    background: #000;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 26px; height: 26px; fill: var(--tesla-red); }
  .wordmark {
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.42em;
    color: #fff;
    padding-left: 4px;
  }
  .brand .sub {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--muted);
    border-left: 1px solid var(--line);
    padding-left: 14px;
    margin-left: 6px;
    text-transform: uppercase;
  }
  .search {
    flex: 1;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }
  .search input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-size: 13.5px;
    outline: none;
  }
  .search input:focus { border-color: #444; }
  .search::before {
    content: "";
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    background: no-repeat center/contain url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238a8a8a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>');
  }
  .account {
    display: flex; align-items: center; gap: 10px;
    margin-left: auto;
  }
  .account .who { text-align: right; line-height: 1.2; }
  .account .who .name { font-size: 13px; font-weight: 600; }
  .account .who .mail { font-size: 11.5px; color: var(--muted); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--tesla-red), #8f0f20);
    display: grid; place-items: center;
    font-weight: 600; font-size: 14px; color: #fff;
  }

  /* ---------- Layout ---------- */
  .shell { display: flex; flex: 1; min-height: 0; }

  /* Sidebar */
  aside {
    width: 232px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .compose {
    margin: 16px;
    padding: 11px 16px;
    background: var(--tesla-red);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  .compose:hover { background: #c9152f; }
  nav { padding: 4px 10px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active { background: rgba(227,25,55,0.14); color: #fff; }
  .nav-item.active .ic { stroke: var(--tesla-red); }
  .nav-item .ic { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .nav-item.active .count { color: var(--tesla-red); font-weight: 600; }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 12px; }
  .labels-title { font-size: 10.5px; letter-spacing: 0.14em; color: var(--muted-2); text-transform: uppercase; padding: 4px 12px 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }

  /* Message list */
  .list {
    width: 380px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    background: var(--bg);
  }
  .list-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .list-head h1 { font-size: 17px; font-weight: 600; }
  .list-head span { font-size: 12px; color: var(--muted); }
  .messages { overflow-y: auto; flex: 1; }
  .msg {
    padding: 13px 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
    border-left: 3px solid transparent;
  }
  .msg:hover { background: var(--panel); }
  .msg.active { background: var(--panel-2); border-left-color: var(--tesla-red); }
  .msg.unread .from, .msg.unread .subj { font-weight: 700; color: #fff; }
  .msg .row1 { display: flex; align-items: center; gap: 8px; }
  .msg .from { font-size: 13.5px; color: var(--text); flex: 1; }
  .msg.unread .from::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    background: var(--tesla-red); border-radius: 50%; margin-right: 8px;
    vertical-align: middle;
  }
  .msg .time { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .msg .subj { font-size: 13px; color: var(--text); }
  .msg .preview { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; letter-spacing: .04em; font-weight: 600; text-transform: uppercase; }
  .tag.eng { background: rgba(52,87,213,.18); color: #7d97ee; }
  .tag.hr { background: rgba(46,160,90,.18); color: #5cc98a; }
  .tag.exec { background: rgba(227,25,55,.16); color: #ef5c73; }
  .tag.ops { background: rgba(200,140,40,.18); color: #e0aa5a; }

  /* Reading pane */
  .reader { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .reader-head { padding: 22px 32px 18px; border-bottom: 1px solid var(--line); }
  .reader-head h2 { font-size: 21px; font-weight: 600; margin-bottom: 14px; line-height: 1.3; }
  .reader-meta { display: flex; align-items: center; gap: 12px; }
  .reader-meta .avatar { width: 42px; height: 42px; font-size: 15px; background: linear-gradient(135deg,#3457d5,#1d3384); }
  .reader-meta .info { line-height: 1.35; }
  .reader-meta .info .n { font-size: 14px; font-weight: 600; }
  .reader-meta .info .e { font-size: 12.5px; color: var(--muted); }
  .reader-meta .when { margin-left: auto; font-size: 12.5px; color: var(--muted); text-align: right; }
  .reader-body { padding: 26px 32px; overflow-y: auto; flex: 1; font-size: 14.5px; line-height: 1.72; color: #dcdcdc; }
  .reader-body p { margin-bottom: 16px; }
  .reader-body .sig { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.6; }
  .reader-body ul { margin: 0 0 16px 20px; }
  .reader-body li { margin-bottom: 6px; }
  .actions { padding: 16px 32px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .btn {
    padding: 9px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    display: flex; align-items: center; gap: 7px;
  }
  .btn:hover { background: var(--panel); }
  .btn.primary { background: var(--tesla-red); border-color: var(--tesla-red); color: #fff; }
  .btn.primary:hover { background: #c9152f; }

  .footer-note { position: fixed; bottom: 8px; right: 12px; font-size: 10.5px; color: #444; letter-spacing: .04em; }

  @media (max-width: 980px) {
    .list { width: 320px; }
    aside { width: 200px; }
    .brand .sub { display: none; }
  }
  @media (max-width: 760px) {
    .reader { display: none; }
    .search { display: none; }
  }
</style>
</head>

const messagesEl = document.getElementById('messages');
const readerEl = document.getElementById('reader');

function tagClass(t){ return t[0]; }

function renderList(){
  messagesEl.innerHTML = emails.map(e => `
    <div class="msg ${e.unread?'unread':''} ${e.id===0?'active':''}" data-id="${e.id}">
      <div class="row1">
        <span class="from">${e.from}</span>
        <span class="tag ${tagClass(e.tag)}">${e.tag[1]}</span>
        <span class="time">${e.time}</span>
      </div>
      <div class="subj">${e.subject}</div>
      <div class="preview">${e.preview}</div>
    </div>`).join('');
  messagesEl.querySelectorAll('.msg').forEach(el => {
    el.addEventListener('click', () => open(parseInt(el.dataset.id)));
  });
}

function bodyHtml(e){
  return e.body.map(p => {
    if(p.startsWith('LIST:')){
      const items = p.slice(5).split('|').map(i=>`<li>${i}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    return `<p>${p}</p>`;
  }).join('') + `<div class="sig">${e.sig.replace(/\n/g,'<br>')}</div>`;
}

function open(id){
  const e = emails.find(x=>x.id===id);
  e.unread = false;
  document.querySelectorAll('.msg').forEach(el=>el.classList.toggle('active', parseInt(el.dataset.id)===id));
  document.querySelectorAll('.msg').forEach(el=>{ if(parseInt(el.dataset.id)===id) el.classList.remove('unread'); });
  readerEl.innerHTML = `
    <div class="reader-head">
      <h2>${e.subject}</h2>
